<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>RHYTHM GAME PORTAL</title>
  <style>
    body {
      background-color: #121214;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    /* タイトルの光るネオン演出 */
    .title-container {
      text-align: center;
      margin-bottom: 50px;
    }
    h1 {
      font-size: 3rem;
      margin: 0;
      letter-spacing: 4px;
      color: #00ffcc;
      text-shadow: 0 0 10px rgba(0, 255, 200, 0.5), 0 0 20px rgba(0, 255, 200, 0.2);
    }
    .subtitle {
      font-size: 1rem;
      color: #aaa;
      margin-top: 10px;
      letter-spacing: 2px;
    }

    /* メインの選択ボタンエリア */
    .menu-container {
      display: flex;
      gap: 40px;
      max-width: 800px;
      width: 100%;
      padding: 0 20px;
      box-sizing: border-box;
    }

    /* モード選択パネル */
    .menu-card {
      flex: 1;
      background: #1a1a1e;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
    }

    /* 遊ぶ（GAME）側のホバーカラー */
    .menu-card.play-mode:hover {
      border-color: #05d9e8;
      box-shadow: 0 0 30px rgba(5, 217, 232, 0.2);
      transform: translateY(-5px);
    }
    .menu-card.play-mode h2 {
      color: #05d9e8;
    }

    /* 作る（EDITOR）側のホバーカラー */
    .menu-card.edit-mode:hover {
      border-color: #ff2a6d;
      box-shadow: 0 0 30px rgba(255, 42, 109, 0.2);
      transform: translateY(-5px);
    }
    .menu-card.edit-mode h2 {
      color: #ff2a6d;
    }

    h2 {
      font-size: 1.8rem;
      margin: 0 0 15px 0;
      transition: color 0.3s;
    }
    p {
      font-size: 0.95rem;
      color: #ccc;
      line-height: 1.6;
      margin: 0;
    }

    /* フッター */
    .footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.8rem;
      color: #444;
    }
  </style>
</head>
<body>

  <div class="title-container">
    <h1>RHYTHM GAME PROJECT</h1>
    <div class="subtitle">SELECT YOUR MODE</div>
  </div>

  <div class="menu-container">
    <!-- 遊ぶモード -->
    <div class="menu-card play-mode" id="btn-play">
      <h2>PLAY GAME</h2>
      <p>楽曲フォルダを読み込んで、<br>自作の譜面や音楽でリズムゲームを遊びます。</p>
    </div>

    <!-- 作るモード -->
    <div class="menu-card edit-mode" id="btn-edit">
      <h2>EDIT CHART</h2>
      <p>音楽を再生しながらキーを叩いて、<br>直感的にタップ＆ホールドの譜面を作成します。</p>
    </div>
  </div>

  <div class="footer">RHYTHM GAME SYSTEM v1.0</div>
  <script>
    // 同一フォルダ内にあるゲーム本体と譜面メーカーのファイル名を指定します
    // お手元のファイル名に合わせて適宜変更してください
    const GAME_FILE = 'game.html';
    const EDITOR_FILE = 'editor_pro.html';

    // 「遊ぶ」カードをクリックしたときの処理
    document.getElementById('btn-play').addEventListener('click', () => {
      window.location.href = GAME_FILE;
    });

    // 「作る」カードをクリックしたときの処理
    document.getElementById('btn-edit').addEventListener('click', () => {
      window.location.href = EDITOR_FILE;
    });
  </script>
</body>
</html>
